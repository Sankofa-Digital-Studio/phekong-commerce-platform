name: Visual regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".storybook/**"
      - "src/**/*.stories.*"
      - "src/components/**"
      - "src/features/**"
      - "src/app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic visual regression
    if: ${{ vars.ENABLE_CHROMATIC == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish Storybook and compare baselines
        uses: chromaui/action@v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          onlyChanged: true
