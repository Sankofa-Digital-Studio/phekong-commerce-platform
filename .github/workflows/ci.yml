name: CI

on:
  pull_request:
    branches:
      - dev
      - preview
      - main
  push:
    branches:
      - dev
      - preview
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:run
      - run: npm run build
      - name: Build static Storybook
        run: npm run build-storybook
      - name: Cypress homepage smoke
        uses: cypress-io/github-action@be1bab96b388bbd9ce3887e397d373c8557e15af
        with:
          start: npm run dev
          wait-on: http://127.0.0.1:3000
          browser: chrome

  supabase-baseline:
    name: Supabase M0 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm repository-pinned Supabase CLI
        run: npm run supabase:version
      - name: Validate migrations, access boundaries and booking conflicts
        run: npm run supabase:m0:ci
