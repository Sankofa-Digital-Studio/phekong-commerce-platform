name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with CI npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit regenerated lockfile
        run: |
          echo LOCKFILE_BEGIN
          base64 package-lock.json
          echo LOCKFILE_END
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  supabase-baseline:
    name: Supabase M0 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with CI npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Confirm repository-pinned Supabase CLI
        run: npm run supabase:version
      - name: Validate migrations, access boundaries and booking conflicts
        run: npm run supabase:m0:ci
