name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:run
      - run: npm run build
      - name: Build static Storybook
        run: npm run build-storybook

  supabase-baseline:
    name: Supabase M0 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm repository-pinned Supabase CLI
        run: npm run supabase:version
      - name: Validate migrations, access boundaries and booking conflicts
        run: npm run supabase:m0:ci
